name: Build

on:
  push:
    # every branch (design doc, Quick CI); not the ci-logs branches CI itself writes
    branches-ignore: ["ci-logs", "ci-logs-*"]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (otherwise quick mode on branches)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  mode:
    # Quick mode on branch pushes: the core suite with vanilla a, vanilla b and Quicksilver on the old-GPU profile
    # (about 10 minutes). Full matrix on main, on a commit with [full] in its message (every pre-merge check) and on a
    # manual run. Each branch publishes its logs to its own ci-logs-<branch> branch.
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
      matrix: ${{ steps.m.outputs.matrix }}
      server_suites: ${{ steps.m.outputs.server_suites }}
      logs: ${{ steps.m.outputs.logs }}
      siftec_report_only: ${{ steps.m.outputs.siftec_report_only }}
    steps:
      - id: m
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          FULL_INPUT: ${{ github.event.inputs.full }}
        run: |
          mode=quick
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then mode=full; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$FULL_INPUT" != "false" ]; then mode=full; fi
          case "$MESSAGE" in *"[full]"*) mode=full;; esac
          if [ $mode = full ]; then
            # package 4b: two more core runs with only the bench-only jar, on plain Fabric and next to Sodium
            matrix='{"suite":["core","siftec"],"run":["vanilla-a","vanilla-b","vanilla-old","vanilla-vk","quicksilver-full","quicksilver-old","quicksilver-vk","measure-full","measure-old","measure-vk"],"include":[{"suite":"core","run":"bench-plain"},{"suite":"core","run":"bench-sodium"}]}'
            server_suites='["core","siftec","terralith"]'
          else
            matrix='{"suite":["core"],"run":["vanilla-a","vanilla-b","quicksilver-old"]}'
            # phase 2's server suite in quick mode: core only (Andre, 2026-10-29); SIFTEC and Terralith in full mode.
            # A commit with [siftec] in its message adds SIFTEC's server suite to a quick run (to work on it without
            # the whole client matrix); [terralith] adds Terralith's the same way (P2-1)
            suites='"core"'
            case "$MESSAGE" in *"[siftec]"*) suites="$suites,\"siftec\"";; esac
            case "$MESSAGE" in *"[terralith]"*) suites="$suites,\"terralith\"";; esac
            server_suites="[$suites]"
          fi
          echo "server_suites=$server_suites" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "logs=ci-logs-$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          # SIFTEC's suites (client and server) report only, failing nothing, until SIFTEC starts with MapMod's latest
          # build again (Andre, 2026-10-31; docs/progress.md, open items). Core and Terralith gate as usual. Set to
          # false to make SIFTEC gate again.
          echo "siftec_report_only=true" >> "$GITHUB_OUTPUT"
          echo "CI mode: $mode" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          cat > /tmp/ci.gradle <<'GRADLE'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ["-Xmaxerrs", "2000"]
            }
            tasks.register("dumpCompileClasspath") {
              doLast {
                def files = new LinkedHashSet()
                project.sourceSets.each { files.addAll(it.compileClasspath.files) }
                new File("/tmp/compile-cp.txt").text = files.join("\n")
              }
            }
          }
          GRADLE
          ./gradlew build --no-daemon -Dorg.gradle.console=plain -I /tmp/ci.gradle 2>&1 | tee build.log
          mkdir -p dist
          v=$(grep '^mod_version' gradle.properties | sed 's/.*= *//')+$(grep '^minecraft_version' gradle.properties | sed 's/.*= *//')
          cp "build/libs/quicksilver-$v.jar" dist/quicksilver.jar
          # package 4b: the bench-only jar (quicksilver-bench: /quicksilver bench, counters, scenes; no Quicksilver module)
          cp "build/libs/quicksilver-bench-$v.jar" dist/quicksilver-bench.jar
          unzip -l dist/quicksilver-bench.jar | tail -1
      - name: Dump game signatures and bytecode
        if: always()
        shell: bash
        run: |
          # .github/dump-signatures: javap -p of every game and Fabric API class; .github/dump-bytecode: javap -c of the
          # game classes whose names match a regex in that file (one per line). Facts for later packages' mixins.
          # Nothing of Mojang's is published (design doc, Rules: Mojang code): the dumps and the class lists go to
          # /tmp/dumps, an Actions artifact kept for 1 day, never to the public ci-logs branch. /tmp/ci holds Quicksilver's
          # own build log and jar list (only build.log reaches ci-logs).
          set +e +o pipefail
          mkdir -p /tmp/ci /tmp/dumps
          ./gradlew dumpCompileClasspath --no-daemon -q -I /tmp/ci.gradle >/dev/null 2>&1 || true
          mcjars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
          echo "$mcjars" > /tmp/mcjars.txt
          fabricjars=$(grep -E '/fabric-[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | tr '\n' ' ')
          if [ -f .github/dump-signatures ]; then
            jars="$mcjars $fabricjars"
            cp=$(echo $jars | tr ' ' ':')
            for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u | sed 's#/#.#g' | grep -v 'package-info\|module-info' > /tmp/dumps/classes.txt
            (xargs -a /tmp/dumps/classes.txt -n 300 javap -p -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/dumps/javap-all.txt.gz
          fi
          if [ -f .github/dump-bytecode ]; then
            cp=$(echo $mcjars | tr ' ' ':')
            for j in $mcjars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u | sed 's#/#.#g' | grep -E -f .github/dump-bytecode > /tmp/dumps/bytecode-classes.txt || true
            (xargs -a /tmp/dumps/bytecode-classes.txt -n 300 javap -p -s -c -constants -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/dumps/bytecode.txt.gz
          fi
          cp build.log /tmp/ci/build.log 2>/dev/null
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/ci/build.log
          ls -l build/libs > /tmp/ci/jars.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: /tmp/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # game class dumps: kept for 1 day, never published (see the step above)
          name: game-dumps
          path: /tmp/dumps
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: quicksilver-jar
          path: |
            dist/quicksilver.jar
            dist/quicksilver-bench.jar
      - name: Build the CI-only lightmap pin mod
        shell: bash
        run: |
          # ci/pin-mod: loaded in every client run, vanilla and Quicksilver alike (see its mixin); compiled against the
          # Mixin jar from the game's compile classpath, never published beyond this run's artifacts
          set -e
          mixin=$(grep -E '/sponge-mixin[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | head -1 || true)
          [ -n "$mixin" ] || mixin=$(find ~/.gradle/caches -name 'sponge-mixin*.jar' 2>/dev/null | grep -v sources | head -1 || true)
          echo "Mixin jar: $mixin"
          test -n "$mixin"
          mkdir -p /tmp/pin/classes /tmp/pin-out
          # the game's compile classpath (and the game jars) too, so the pin mixins can name the game's types
          cp="$mixin:$(tr '\n' ':' < /tmp/compile-cp.txt):$(tr '\n' ':' < /tmp/mcjars.txt)"
          javac --release 25 -cp "$cp" -d /tmp/pin/classes $(find ci/pin-mod/src -name '*.java')
          cp ci/pin-mod/fabric.mod.json ci/pin-mod/*.mixins.json /tmp/pin/classes/
          (cd /tmp/pin/classes && jar cf /tmp/pin-out/ci-pin.jar .)
          unzip -l /tmp/pin-out/ci-pin.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ci-pin-jar
          path: /tmp/pin-out/ci-pin.jar
      - name: Build the CI-only server harness mod
        shell: bash
        run: |
          # ci/server/harness (phase 2): loaded in every server-suite run, vanilla and Quicksilver alike; built like the
          # pin mod, never published beyond this run's artifacts
          set -eo pipefail
          mixin=$(grep -E '/sponge-mixin[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | head -1 || true)
          [ -n "$mixin" ] || mixin=$(find ~/.gradle/caches -name 'sponge-mixin*.jar' 2>/dev/null | grep -v sources | head -1 || true)
          mkdir -p /tmp/harness/classes /tmp/harness-out /tmp/harness-log
          cp="$mixin:$(tr '\n' ':' < /tmp/compile-cp.txt):$(tr '\n' ':' < /tmp/mcjars.txt)"
          # its compiler output goes to the server suite's logs branch (server-compare publishes it)
          javac --release 25 -Xmaxerrs 500 -cp "$cp" -d /tmp/harness/classes $(find ci/server/harness/src -name '*.java') 2>&1 | tee /tmp/harness-log/javac.log
          cp ci/server/harness/fabric.mod.json ci/server/harness/*.mixins.json /tmp/harness/classes/
          python3 ci/server/harness/make-structures.py /tmp/harness/classes/data/ci_server_harness/gametest/structure
          (cd /tmp/harness/classes && jar cf /tmp/harness-out/ci-server-harness.jar .)
          unzip -l /tmp/harness-out/ci-server-harness.jar | tail -3
          # Fabric API's GameTest module ships only in development environments, not in its release jar: the server
          # suite's GameTest phase loads it from the build's own classpath (Apache-2.0; CI only, never published)
          gt=$(grep -E '/fabric-gametest-api-v1[^/]*\.jar$' /tmp/compile-cp.txt | grep -v sources | head -1)
          echo "GameTest module: $gt"
          test -n "$gt"
          cp "$gt" /tmp/harness-out/fabric-gametest-api-v1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ci-server-harness-jar
          path: /tmp/harness-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-build-logs
          path: |
            /tmp/harness-log
            /tmp/ci/build.log
          if-no-files-found: ignore

  siftec-world:
    # SIFTEC's server and CI world, built once per SIFTEC build and smoke-file change and shared by the SIFTEC runs
    # (full mode only)
    needs: [mode]
    if: needs.mode.outputs.mode == 'full'
    continue-on-error: ${{ needs.mode.outputs.siftec_report_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meakaandre-tech/SIFTEC
          path: siftec
          sparse-checkout: .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Cache key
        id: key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api repos/meakaandre-tech/SIFTEC/releases/tags/latest --jq '[.assets[] | "\(.name)=\(.id)"] | join(",")' | sha256sum | cut -c1-16 || echo none)
          files=$(cat siftec/.github/smoke-commands.txt siftec/.github/smoke-pack-mods siftec/.github/fetch-tb.py ci/siftec-world.sh ci/pack-lock.txt gradle.properties | sha256sum | cut -c1-16)
          echo "key=siftec-world-$asset-$files" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: siftec-server
          key: ${{ steps.key.outputs.key }}
      - name: Build SIFTEC's server and CI world
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/siftec-world.sh
      - name: Pack lock
        # every downloaded jar against ci/pack-lock.txt: a changed pack fails here, before any client run
        shell: bash
        run: bash ci/pack-check.sh siftec-server/mods siftec complete
      - name: Pack the server
        shell: bash
        run: tar cf siftec-server.tar siftec-server && ls -l siftec-server.tar
      - uses: actions/upload-artifact@v4
        with:
          name: siftec-server
          path: siftec-server.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siftec-world-logs
          path: /tmp/out

  core-world:
    # The core suite's server and world, generated once and shared by every core client run (see ci/core-world.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Cache key
        id: key
        shell: bash
        run: echo "key=core-world-$(cat ci/core-world.sh ci/pack-lock.txt gradle.properties | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: core-server
          key: ${{ steps.key.outputs.key }}
      - name: Build the core server and world
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/core-world.sh
      - name: Pack lock
        shell: bash
        run: bash ci/pack-check.sh core-server/mods core complete
      - name: Pack the server
        shell: bash
        run: tar cf core-server.tar core-server && ls -l core-server.tar
      - uses: actions/upload-artifact@v4
        with:
          name: core-server
          path: core-server.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-world-logs
          path: /tmp/out

  client:
    needs: [mode, build, siftec-world, core-world]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.core-world.result == 'success' && (needs.siftec-world.result == 'success' || needs.siftec-world.result == 'skipped' || needs.mode.outputs.siftec_report_only == 'true') }}
    continue-on-error: ${{ matrix.suite == 'siftec' && needs.mode.outputs.siftec_report_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # the mode job's matrix: suites core and siftec with every run (measure-*: Quicksilver loaded with every module
      # off, so its bench measures vanilla's own draw calls and terrain GPU memory in the same run, package 3's
      # at-or-under-vanilla gates), or in quick mode core with vanilla-a, vanilla-b and quicksilver-old
      matrix: ${{ fromJSON(needs.mode.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: quicksilver-jar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ci-pin-jar
          path: ci-pin
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'siftec'
        with:
          name: siftec-server
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'core'
        with:
          name: core-server
      - name: Run the client
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          RUN: ${{ matrix.run }}
          OUT: /tmp/out/${{ matrix.suite }}-${{ matrix.run }}
          BENCH_SECONDS: "20"
          # the bench-only runs (package 4b) bench these scenes only
          BENCH_SCENES: "spawn flythrough water_glass nether"
        run: |
          chmod +x gradlew
          if [ -f siftec-server.tar ]; then tar xf siftec-server.tar; fi
          if [ -f core-server.tar ]; then tar xf core-server.tar; fi
          bash ci/client-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ matrix.suite }}-${{ matrix.run }}
          path: /tmp/out

  compare:
    needs: [mode, build, client]
    # also after a failed build, so its log (build/build.log) reaches ci-logs; compare then fails on the missing runs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: res-*
          path: /tmp/res
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-logs
          path: /tmp/build-logs
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: siftec-world-logs
          path: /tmp/ci/siftec-world
      - name: Compare pictures and counts
        id: compare
        shell: bash
        run: |
          set +e
          python3 -m pip install --quiet --break-system-packages pillow numpy
          CI_MODE="${{ needs.mode.outputs.mode }}" CI_SIFTEC_REPORT_ONLY="${{ needs.mode.outputs.siftec_report_only }}" python3 ci/compare.py /tmp/res /tmp/ci/compare
          st=$?
          cat /tmp/ci/compare/report.md >> "$GITHUB_STEP_SUMMARY"
          # P2-2: the Logic module in the client runs (ci/server/compare-p2.py)
          CI_SIFTEC_REPORT_ONLY="${{ needs.mode.outputs.siftec_report_only }}" python3 -I ci/server/compare-p2.py client /tmp/res /tmp/ci/compare
          p2=$?
          cat /tmp/ci/compare/p2-client.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$(( st || p2 ))" >> "$GITHUB_OUTPUT"
      - name: Publish logs, bench results and screenshots to the branch's ci-logs-<branch> branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci/runs && { cp -r /tmp/res/* /tmp/ci/runs/ 2>/dev/null || echo 'no client results'; }
          # Quicksilver's own build log only: no game class dumps or lists on ci-logs (they are the 1-day game-dumps artifact)
          cp /tmp/build-logs/build.log /tmp/ci/build.log 2>/dev/null || echo 'no build log'
          rm -rf /tmp/ci/build
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ${{ needs.mode.outputs.mode }}" > /tmp/ci/commit.txt
          logs="${{ needs.mode.outputs.logs }}"
          cd /tmp/ci
          git init -q -b "$logs"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "CI logs for ${GITHUB_SHA} (${GITHUB_REF_NAME}, ${{ needs.mode.outputs.mode }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$logs"
      - name: Fail on a wrong picture or a rise in counts
        shell: bash
        run: test "${{ steps.compare.outputs.status }}" = "0"

  # ---- phase 2 server suite (ci/server/; P2-0): dedicated server, no client, on every branch in quick mode too.
  # Every run loads the CI-only server harness and runs with one worldgen thread (fixed generation order).
  server-base:
    # the world every scripted run of a suite starts from (vanilla, generated once per run of this workflow)
    needs: [mode, build]
    continue-on-error: ${{ matrix.suite == 'siftec' && needs.mode.outputs.siftec_report_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # every suite: core's and SIFTEC's scripted runs start from it, and every suite's heap run (P2-1); in quick
        # mode core only
        suite: ${{ fromJSON(needs.mode.outputs.server_suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.suite == 'siftec'
        with:
          repository: meakaandre-tech/SIFTEC
          path: siftec
          sparse-checkout: .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: ci-server-harness-jar
          path: ci-server-harness
      - name: Generate the base world
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          RUN: base
          OUT: /tmp/sout/${{ matrix.suite }}-base
        run: bash ci/server/server-run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server-base-${{ matrix.suite }}
          path: server-base.tar
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sres-${{ matrix.suite }}-base
          path: /tmp/sout
          retention-days: 3

  server:
    needs: [mode, build, server-base]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    continue-on-error: ${{ matrix.suite == 'siftec' && needs.mode.outputs.siftec_report_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # core: worldgen, GameTests, scripted-run world diff; siftec: SIFTEC's pack, its worldgen and self-tests;
        # terralith: Terralith's worldgen. Quick mode: core only (the mode job's server_suites)
        suite: ${{ fromJSON(needs.mode.outputs.server_suites) }}
        # three vanilla runs: what vanilla does differently between its own runs is its noise (the standing rule's
        # three samples), and Quicksilver is gated wherever all three agree
        run: [vanilla-a, vanilla-b, vanilla-c, quicksilver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.suite == 'siftec'
        with:
          repository: meakaandre-tech/SIFTEC
          path: siftec
          sparse-checkout: .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: quicksilver-jar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ci-server-harness-jar
          path: ci-server-harness
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-base-${{ matrix.suite }}
      - name: Run the server suite
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          RUN: ${{ matrix.run }}
          OUT: /tmp/sout/${{ matrix.suite }}-${{ matrix.run }}
        run: bash ci/server/server-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sres-${{ matrix.suite }}-${{ matrix.run }}
          path: /tmp/sout
          retention-days: 3

  server-perf:
    # P2-2: MSPT of vanilla and Quicksilver on ONE runner, alternating, in each suite's perf scenes
    # (ci/server/perf-run.sh, ci/server/perf-<suite>.txt; a suite without one does nothing), with JFR for where the time
    # goes; compared and gated in server-compare (ci/server/compare-p2.py)
    needs: [mode, build, server-base]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # SIFTEC report-only (the mode job's siftec_report_only): a SIFTEC failure fails nothing
    continue-on-error: ${{ matrix.suite == 'siftec' && needs.mode.outputs.siftec_report_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.mode.outputs.server_suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.suite == 'siftec'
        with:
          repository: meakaandre-tech/SIFTEC
          path: siftec
          sparse-checkout: .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: quicksilver-jar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ci-server-harness-jar
          path: ci-server-harness
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-base-${{ matrix.suite }}
      - name: Measure MSPT, vanilla and Quicksilver alternately
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          OUT: /tmp/sout/${{ matrix.suite }}-perf
        run: bash ci/server/perf-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sres-${{ matrix.suite }}-perf
          path: /tmp/sout
          retention-days: 3

  server-net:
    # the network check: a vanilla client on a Quicksilver server and a Quicksilver client on a vanilla server,
    # through the scripted run (ci/server/net-run.sh)
    needs: [build, server-base]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        run: [net-vanilla-client, net-qs-client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: quicksilver-jar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ci-server-harness-jar
          path: ci-server-harness
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-base-core
      - name: Run the network check
        shell: bash
        env:
          RUN: ${{ matrix.run }}
          OUT: /tmp/sout/core-${{ matrix.run }}
        run: |
          chmod +x gradlew
          bash ci/server/net-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sres-core-${{ matrix.run }}
          path: /tmp/sout
          retention-days: 3

  server-compare:
    needs: [mode, build, server, server-net, server-perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sres-*
          path: /tmp/sres
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-build-logs
          path: /tmp/sci/build
      - name: Self-test the world comparator, then compare the runs
        id: compare
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/sci/compare
          python3 -I ci/server/test_worlddiff.py > /tmp/sci/compare/worlddiff-selftest.txt 2>&1
          self=$?
          extra=$(echo '${{ needs.mode.outputs.server_suites }}' | python3 -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          CI_MODE="${{ needs.mode.outputs.mode }}" CI_EXTRA_SUITES="$extra" CI_SIFTEC_REPORT_ONLY="${{ needs.mode.outputs.siftec_report_only }}" python3 -I ci/server/compare-server.py /tmp/sres /tmp/sci/compare
          cmp=$?
          cat /tmp/sci/compare/report.md >> "$GITHUB_STEP_SUMMARY"
          tail -1 /tmp/sci/compare/worlddiff-selftest.txt >> "$GITHUB_STEP_SUMMARY"
          # P2-2: the perf job (same-runner MSPT, gated) and the Logic module (ci/server/compare-p2.py)
          CI_MODE="${{ needs.mode.outputs.mode }}" CI_EXTRA_SUITES="$extra" CI_SIFTEC_REPORT_ONLY="${{ needs.mode.outputs.siftec_report_only }}" python3 -I ci/server/compare-p2.py server /tmp/sres /tmp/sci/compare
          p2=$?
          cat /tmp/sci/compare/p2.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$(( self || cmp || p2 ))" >> "$GITHUB_OUTPUT"
      - name: Publish the server suite's logs to ci-logs-server-<branch>
        if: always()
        shell: bash
        run: |
          # results without the saved worlds (they stay in the run's artifacts); Quicksilver's own build log and the
          # harness's compiler output, nothing of Mojang's
          set +e
          mkdir -p /tmp/sci/runs
          if [ -d /tmp/sres ]; then (cd /tmp/sres && find . -type f ! -path '*/world/*' -size -20M -exec cp --parents {} /tmp/sci/runs/ \;); fi
          set -e
          logs="ci-logs-server-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ${{ needs.mode.outputs.mode }}" > /tmp/sci/commit.txt
          cd /tmp/sci
          git init -q -b "$logs"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Server suite logs for ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$logs"
      - name: Fail on any Quicksilver-only difference or a harness that doesn't repeat
        shell: bash
        run: test "${{ steps.compare.outputs.status }}" = "0"

  release:
    needs: [mode, build, compare, server-compare]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.mode.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quicksilver-jar
          path: dist
      - name: Publish the jar as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest -y --cleanup-tag -R "${{ github.repository }}" || true
          sleep 3
          cp dist/quicksilver.jar quicksilver-26.3.jar
          # package 4b: the bench-only jar next to it (for comparing vanilla, Sodium and Quicksilver, docs/laptop-bench.md)
          cp dist/quicksilver-bench.jar quicksilver-bench-26.3.jar
          gh release create latest quicksilver-26.3.jar quicksilver-bench-26.3.jar -R "${{ github.repository }}" --target "${GITHUB_SHA}" --title "Quicksilver (latest build)" --notes "Built from main at ${GITHUB_SHA}. Fabric 26.3, needs Fabric API. quicksilver-26.3.jar: Quicksilver (draws what vanilla draws, faster). quicksilver-bench-26.3.jar: only /quicksilver bench, its counters and scenes, with every Quicksilver module left out; use it instead of Quicksilver on plain Fabric or next to Sodium to compare them (docs/laptop-bench.md). Never both in one instance. Known trade: while flying into new terrain, a visible section can appear up to 15 frames later than in vanilla (terrain uploads are spread over frames), for smoother frame times."
