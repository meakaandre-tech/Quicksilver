plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// P2-4: the class tweaker (an access widener) for the Chunks module's mixins
loom {
    accessWidenerPath = file("src/main/resources/quicksilver.classtweaker")
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") { rename { "LICENSE_quicksilver" } }
    from("COPYING") { rename { "COPYING_quicksilver" } }
    from("NOTICE") { rename { "NOTICE_quicksilver" } }
    from("LICENSE-APACHE-2.0") { rename { "LICENSE-APACHE-2.0_quicksilver" } }
    from("LICENSE-MIT-FerriteCore") { rename { "LICENSE-MIT-FerriteCore_quicksilver" } }
}

// Package 4b: the bench-only jar (quicksilver-bench): /quicksilver bench, its counters, the capability probe and the
// scenes, and none of Quicksilver's modules, so it runs on plain Fabric or next to Sodium and measures them the same way.
// Built from the same classes as the full jar; its own mod id and mixin config name, so it can never be mistaken for
// Quicksilver (and it declares that it breaks Quicksilver: only one of the two belongs in an instance). It holds no
// Indigo-derived code, so no NOTICE; its counters mixin config is copied as is (26.3 is unobfuscated, no refmap).
def benchClasses = [
    'com/meakaandre/quicksilver/QuicksilverClient.class',
    'com/meakaandre/quicksilver/bench/**',
    'com/meakaandre/quicksilver/probe/**',
    'com/meakaandre/quicksilver/gui/**',
    'com/meakaandre/quicksilver/mixin/counters/**',
    'com/meakaandre/quicksilver/phase2/**',
    'quicksilver/scenes/**',
]
def benchJar = tasks.register("benchJar", Jar) {
    archiveBaseName = "quicksilver-bench"
    dependsOn tasks.named("classes")
    from(sourceSets.main.output) { include benchClasses }
    from("src/main/resources") {
        include "quicksilver.counters.mixins.json"
        rename { "quicksilver_bench.counters.mixins.json" }
    }
    // phase 2 (P2-0): the count-only network byte mixin, for the bench's server numbers
    from("src/main/resources") {
        include "quicksilver.phase2.mixins.json"
        rename { "quicksilver_bench.phase2.mixins.json" }
    }
    def version = project.version
    inputs.property "version", version
    from("src/bench") {
        include "fabric.mod.json"
        expand "version": version
    }
    from("LICENSE") { rename { "LICENSE_quicksilver_bench" } }
    from("COPYING") { rename { "COPYING_quicksilver_bench" } }
}
tasks.named("assemble") { dependsOn benchJar }
